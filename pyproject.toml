[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pinspect-cli"
version = "1.0.2"
description = "Fast Linux process-intelligence CLI and forensics tool that goes far beyond ps aux"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Baba01hacker666" }
]
keywords = [
    "linux",
    "procfs",
    "process",
    "cli",
    "security",
    "forensics",
    "tui",
    "edr",
    "siem",
    "system-monitoring",
    "process-intelligence",
    "process-tree",
    "systemd",
    "cgroups",
    "namespaces",
    "capabilities",
    "pstree",
    "lsof",
    "terminal-ui",
    "devops",
    "sre",
    "sysadmin",
    "incident-response",
    "secret-redaction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=12.0.0",
]

[project.scripts]
pinspect = "pinspect.cli.main:main"

[project.urls]
Homepage = "https://github.com/Baba01hacker666/pinspect"
Repository = "https://github.com/Baba01hacker666/pinspect"
Issues = "https://github.com/Baba01hacker666/pinspect/issues"
Changelog = "https://github.com/Baba01hacker666/pinspect/releases"

[tool.flit.module]
name = "pinspect"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",                # pyflakes
    "I",                # isort
    "UP",               # pyupgrade (py38-aware)
    "B",                # flake8-bugbear
    "C4",               # flake8-comprehensions
    "SIM",              # flake8-simplify
    "RUF",              # ruff-specific
]
ignore = [
    "BLE001",  # broad excepts are intentional: graceful recovery on /proc read errors
    "S110",    # best-effort reads intentionally swallow errors
    "DTZ006",  # naive local timestamps are fine for CLI display
    "FA100",   # typing.List/Dict/etc. required for Python 3.8 (pre-PEP 585)
]
